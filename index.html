<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animeverse - Ultimate Anime Universe</title>
<meta name="description" content="Stream 2000+ anime in HD">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06070d;--card:#12131e;--neon:#8a5cf5;--neon2:#ff4ecd;--text:#e8e8ff;--muted:#8b8ca6}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif}
header{position:sticky;top:0;z-index:99;background:rgba(6,7,13,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(138,92,245,0.15);display:flex;justify-content:space-between;align-items:center;padding:14px 5%;flex-wrap:wrap;gap:10px}
.logo{font-family:'Space Grotesk';font-weight:800;font-size:26px;cursor:pointer}
.logo span{color:var(--neon);text-shadow:0 0 15px var(--neon)}
.nav{display:flex;gap:10px;align-items:center}
.search{display:flex;background:var(--card);border-radius:999px;padding:8px 16px;border:1px solid rgba(255,255,255,0.08);width:380px}
.search input{flex:1;background:transparent;border:none;color:white;outline:none;font-size:14px}
.search button{background:var(--neon);border:none;color:white;padding:6px 14px;border-radius:999px;cursor:pointer}
.mylist-btn{background:var(--card);border:1px solid rgba(255,255,255,0.1);color:white;padding:9px 16px;border-radius:999px;cursor:pointer;font-size:13px}
.mylist-btn b{color:var(--neon2)}
.hero{margin:24px 5%;height:420px;border-radius:24px;position:relative;overflow:hidden;background:linear-gradient(100deg, #8a5cf5 0%, #ff4ecd 100%);display:flex;align-items:center;padding:40px}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg, rgba(6,7,13,0.92) 25%, rgba(6,7,13,0.2) 100%)}
.hero-content{position:relative;z-index:2;max-width:540px}
.hero h1{font-size:48px;line-height:1.05;font-family:'Space Grotesk';font-weight:800}
.hero h1 b{color:transparent;-webkit-text-stroke:1px white}
.hero p{color:var(--muted);margin:14px 0 22px;font-size:16px}
.hero-btns{display:flex;gap:12px}
.btn-primary{background:white;color:black;padding:12px 24px;border-radius:999px;text-decoration:none;font-weight:700;display:inline-block;cursor:pointer;border:none}
.btn-sec{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);color:white;padding:12px 24px;border-radius:999px;border:1px solid rgba(255,255,255,0.2);cursor:pointer;font-weight:600}
.filters{display:flex;gap:12px;padding:10px 5%;overflow-x:auto;scrollbar-width:none}
.filter{padding:8px 18px;border-radius:999px;background:var(--card);border:1px solid rgba(255,255,255,0.08);cursor:pointer;white-space:nowrap;font-size:13px;transition:0.3s}
.filter.active,.filter:hover{background:var(--neon);border-color:var(--neon);color:white;box-shadow:0 0 15px rgba(138,92,245,0.5)}
.section-title{padding:20px 5% 10px;font-size:22px;font-family:'Space Grotesk';display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:16px;padding:10px 5% 40px}
.card{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,0.06);transition:0.35s;cursor:pointer;position:relative}
.card:hover{transform:translateY(-8px) scale(1.02);border-color:var(--neon);box-shadow:0 10px 30px rgba(138,92,245,0.3)}
.card img{width:100%;height:235px;object-fit:cover}
.card-info{padding:10px 12px}
.card-info h3{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-info span{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-top:4px}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.75);backdrop-filter:blur(10px);font-size:10px;padding:4px 8px;border-radius:999px;border:1px solid rgba(255,255,255,0.1)}
.badge.top{background:var(--neon);border:none}
.add-btn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.75);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;opacity:0;transition:0.3s}
.card:hover .add-btn{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(12px);z-index:100;display:none;place-items:center;padding:5%}
.modal.active{display:grid}
.modal-box{background:#0f1020;border:1px solid rgba(138,92,245,0.3);border-radius:20px;max-width:800px;width:100%;overflow:hidden;display:flex;max-height:90vh}
.modal-box img{width:320px;object-fit:cover}
.modal-info{padding:24px;overflow-y:auto}
.close{position:absolute;top:20px;right:20px;background:var(--card);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.loader{text-align:center;padding:40px;color:var(--muted)}
@media(max-width:700px){.hero{height:340px}.hero h1{font-size:32px}.search{width:100%}.modal-box{flex-direction:column}.modal-box img{width:100%;height:260px}}
</style>
</head>
<body>
<header>
<div class="logo" onclick="location.reload()">ANIME<span>VERSE</span></div>
<div class="nav">
<div class="search"><input id="searchInput" placeholder="Search 2000+ anime..." onkeyup="searchAnime()"><button onclick="searchAnime()">⌕</button></div>
<button class="mylist-btn" onclick="showMyList()">❤️ My List <b id="listCount">0</b></button>
</div>
</header>
<div class="hero" id="hero">
<div class="hero-content">
<h1 id="heroTitle">WATCH THE <b>UNIVERSE</b> OF ANIME</h1>
<p id="heroDesc">Stream 2000+ anime in HD, no ads. Updated daily with auto-sync from MyAnimeList.</p>
<div class="hero-btns">
<button class="btn-primary" onclick="document.getElementById('grid').scrollIntoView({behavior:'smooth'})">Explore Now →</button>
<button class="btn-sec" onclick="showMyList()">My List</button>
</div>
</div>
</div>
<div class="filters">
<div class="filter active" onclick="filterAnime('all',this)">🔥 Trending</div>
<div class="filter" onclick="filterAnime('action',this)">⚔️ Action</div>
<div class="filter" onclick="filterAnime('romance',this)">❤️ Romance</div>
<div class="filter" onclick="filterAnime('comedy',this)">😂 Comedy</div>
<div class="filter" onclick="filterAnime('adventure',this)">🗺️ Adventure</div>
<div class="filter" onclick="filterAnime('fantasy',this)">✨ Fantasy</div>
<div class="filter" onclick="filterAnime('movie',this)">🎬 Movies</div>
</div>
<div class="section-title"><span id="sectionText">Trending This Week</span><span style="font-size:12px;color:var(--muted)" id="countText">Loading...</span></div>
<div class="grid" id="grid"><div class="loader">Loading universe... ✨</div></div>
<div class="modal" id="modal" onclick="if(event.target==this)closeModal()">
<div class="close" onclick="closeModal()">✕</div>
<div class="modal-box" id="modalBox"></div>
</div>
<script>
let allAnime = [];
let myList = JSON.parse(localStorage.getItem('animeverse_list')||'[]');
let currentFilter = 'all';
updateCount();
async function fetchTrending(){
  try{
    const res = await fetch('https://api.jikan.moe/v4/top/anime?limit=24');
    const data = await res.json();
    allAnime = data.data;
    render(allAnime);
  }catch(e){ allAnime=[]; render([]); }
}
function render(list){
  document.getElementById('countText').innerText = list.length + ' anime';
  document.getElementById('grid').innerHTML = list.map((a,i)=>`
    <div class="card" onclick="openModal(${a.mal_id})">
      ${i<3?'<div class="badge top">TOP '+(i+1)+'</div>':'<div class="badge">HD</div>'}
      <div class="add-btn" onclick="event.stopPropagation();toggleList(${a.mal_id})">${myList.includes(a.mal_id)?'❤️':'🤍'}</div>
      <img src="${a.images.jpg.large_image_url}" loading="lazy">
      <div class="card-info"><h3>${a.title}</h3><span><i>${a.type||'TV'} • ${a.episodes||'?'} Eps</i><i>⭐ ${a.score||'?'}</i></span></div>
    </div>
  `).join('');
}
function searchAnime(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  if(!q){render(allAnime);document.getElementById('sectionText').innerText='Trending This Week';return}
  const f = allAnime.filter(a=>a.title.toLowerCase().includes(q));
  document.getElementById('sectionText').innerText = `Search: "${q}"`;
  render(f);
}
async function filterAnime(genre,el){
  document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  currentFilter=genre;
  if(genre=='all'){fetchTrending();document.getElementById('sectionText').innerText='Trending This Week';return}
  document.getElementById('grid').innerHTML='<div class="loader">Loading '+genre+'... ✨</div>';
  try{
    const res = await fetch(`https://api.jikan.moe/v4/anime?genres=${getGenreId(genre)}&order_by=popularity&limit=24`);
    const data = await res.json();
    allAnime = data.data;
    document.getElementById('sectionText').innerText = genre.toUpperCase();
    render(allAnime);
  }catch(e){render([])}
}
function getGenreId(name){ const map={action:1,adventure:2,comedy:4,fantasy:10,romance:22,movie:0}; return map[name]||1; }
function toggleList(id){
  if(myList.includes(id)) myList = myList.filter(x=>x!=id);
  else myList.push(id);
  localStorage.setItem('animeverse_list',JSON.stringify(myList));
  updateCount(); render(allAnime);
}
function updateCount(){document.getElementById('listCount').innerText=myList.length}
function showMyList(){
  if(myList.length==0){alert('My List empty! Add some anime ❤️');return}
  const list = allAnime.filter(a=>myList.includes(a.mal_id));
  document.getElementById('sectionText').innerText='My List ❤️';
  render(list);
}
function openModal(id){
  const a = allAnime.find(x=>x.mal_id==id);
  if(!a)return;
  document.getElementById('modalBox').innerHTML=`
    <img src="${a.images.jpg.large_image_url}">
    <div class="modal-info">
      <h2 style="font-family:Space Grotesk">${a.title}</h2>
      <p style="color:var(--muted);margin:8px 0">⭐ ${a.score||'?'} • ${a.type||'TV'} • ${a.episodes||'?'} Eps • ${a.status||''}</p>
      <p style="margin:16px 0;line-height:1.6;font-size:14px">${a.synopsis||'No synopsis available. Premium anime streaming experience.'}</p>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button class="btn-primary" onclick="toggleList(${a.mal_id});closeModal()">${myList.includes(a.mal_id)?'Remove from List':'Add to My List ❤️'}</button>
        <button class="btn-sec" onclick="closeModal()">Close</button>
      </div>
    </div>`;
  document.getElementById('modal').classList.add('active');
}
function closeModal(){document.getElementById('modal').classList.remove('active')}
fetchTrending();
</script>
</body>
</html>
