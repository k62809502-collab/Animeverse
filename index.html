<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soumya - Font Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pacifico&family=Lobster&family=Righteous&family=Monoton&family=Orbitron:wght@700&family=Bangers&family=Audiowide&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07080f;color:#fff;font-family:sans-serif}
header{position:sticky;top:0;z-index:99;background:#07080f;border-bottom:1px solid #ff005522;padding:10px 3%;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.logo{font-family:'Audiowide';font-size:20px} .logo span{color:#ff0055}
.top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.top input{background:#151725;border:1px solid #ffffff22;color:#fff;padding:10px 14px;border-radius:999px;width:150px}
.btn{background:linear-gradient(90deg,#ff0055,#ff6a00);border:none;color:#fff;padding:10px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px}
.btn2{background:#151725;border:1px solid #ffffff22;color:#fff;padding:10px 14px;border-radius:999px;cursor:pointer;font-size:13px}
.upload{background:#151725;border:1px dashed #ffffff44;padding:10px 12px;border-radius:999px;cursor:pointer;font-size:12px}
.upload input{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding:10px 3%}
.card{background:#151725;border-radius:10px;min-height:80px;display:grid;place-items:center;padding:10px;position:relative;overflow:hidden;border:1px solid #ffffff11}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.3}
.card .txt{position:relative;z-index:2;font-size:18px;text-align:center;word-break:break-all}
.banner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:10px 3%}
.banner{height:120px;border-radius:10px;display:grid;place-items:center;position:relative;overflow:hidden;border:1px solid #ffffff11}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.6}
.banner .bt{position:relative;z-index:2;font-family:'Audiowide';font-size:20px}
.logo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;padding:10px 3%}
.logo-card{aspect-ratio:1;background:#151725;border-radius:10px;display:grid;place-items:center;position:relative;overflow:hidden;border:1px solid #ffffff11}
.logo-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.5}
.logo-card .lt{position:relative;z-index:2;font-family:'Audiowide';text-align:center}
</style>
</head>
<body>
<header>
<div class="logo">SOUMYA <span>STUDIO</span></div>
<div class="top">
<input id="nameInput" value="Soumya" placeholder="Naam likho">
<label class="upload">📸 Photo<input type="file" accept="image/*" onchange="loadPhoto(event)"></label>
<button class="btn" onclick="genAll()">✨ Generate 1000</button>
<button class="btn2" onclick="genBanners()">🎨 Banner/Logo 500</button>
</div>
</header>

<div style="padding:8px 3%;font-weight:700;font-size:14px">🔥 1000 Fonts - Tera Naam</div>
<div class="grid" id="g1"></div>

<div style="padding:8px 3%;font-weight:700;font-size:14px">🎨 500 Banners - Photo Auto</div>
<div class="banner-grid" id="g2"></div>

<div style="padding:8px 3%;font-weight:700;font-size:14px">🔰 500 Logos - Photo Auto</div>
<div class="logo-grid" id="g3"></div>

<script>
let cur="Soumya";let pic=null;
const fonts=[['Bebas Neue','#00f5ff'],['Pacifico','#ffcc00'],['Lobster','#ff6a00'],['Righteous','#00ff88'],['Monoton','#fff'],['Orbitron','#00f5ff'],['Bangers','#ff3300'],['Audiowide','#ff0055']];
const bgs=['linear-gradient(135deg,#ff0055,#ff6a00)','linear-gradient(135deg,#00f5ff,#0066ff)','linear-gradient(135deg,#ffcc00,#ff3300)','linear-gradient(135deg,#00ff88,#00ccff)','linear-gradient(135deg,#8a5cf5,#ff4ecd)','linear-gradient(135deg,#1a1a1a,#3a3a3a)'];
function loadPhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{pic=x.target.result;genAll();};r.readAsDataURL(f);}
function genAll(){cur=document.getElementById('nameInput').value||'Soumya';genFonts();genBanners();}
function genFonts(){let h='';for(let i=0;i<1000;i++){const [fn,col]=fonts[i%fonts.length];const bg=bgs[i%bgs.length];h+=`<div class="card" style="background:${bg}">${pic?`<img src="${pic}">`:''}<div class="txt" style="font-family:'${fn}';color:${col}">${cur}</div></div>`;}document.getElementById('g1').innerHTML=h;}
function genBanners(){let h2='',h3='';for(let i=0;i<500;i++){const bg=bgs[i%bgs.length];h2+=`<div class="banner" style="background:${bg}">${pic?`<img src="${pic}">`:''}<div class="bt">${cur}</div></div>`;h3+=`<div class="logo-card" style="background:${bg}">${pic?`<img src="${pic}">`:''}<div class="lt">${cur.charAt(0).toUpperCase()}<br><small style="font-size:10px">${cur}</small></div></div>`;}document.getElementById('g2').innerHTML=h2;document.getElementById('g3').innerHTML=h3;}
genAll();
</script>
</body>
</html>
