<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMEVERSE - 8033 FIXED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;padding:10px}
.header{display:flex;justify-content:space-between;align-items:center;background:#0a0a0a;padding:12px 15px;border-radius:12px;border:1px solid #222}
.logo{font-weight:900;font-size:22px;letter-spacing:1px}
.logo span{color:#ff00a0}.logo b{color:#00e5ff}
.badge{background:#fff;color:#000;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:800;margin-left:10px}
.yt{background:#ff0000;color:#fff;padding:6px 14px;border-radius:20px;text-decoration:none;font-weight:800;font-size:13px}
.box{margin-top:15px;background:#0f0f0f;border:1px solid #00ff88;border-radius:16px;padding:15px;display:flex;justify-content:space-between;align-items:center}
.box b{color:#00ff88}
.save{background:#00ff88;color:#000;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:800;margin-left:8px}
.timer{background:#ff2d95;color:#fff;padding:10px 22px;border-radius:20px;font-weight:900}
.small{font-size:12px;color:#aaa;margin-top:4px}
.btn-row{display:flex;gap:8px;overflow:auto;margin-top:15px;padding-bottom:5px}
.btn-row button{background:#1a1a1a;color:#888;border:none;padding:10px 16px;border-radius:20px;font-weight:700;white-space:nowrap}
.btn-row button.active{background:#fff;color:#000}
.card{background:#141414;border:1px solid #222;border-radius:20px;padding:18px;margin-top:15px}
.card h2{font-size:20px;margin-bottom:15px}
.input{width:100%;background:#fff;color:#000;border:none;padding:16px;border-radius:30px;text-align:center;font-weight:800;font-size:16px;outline:none}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.row button{flex:1;padding:12px;border-radius:20px;border:none;font-weight:800;background:#2a2a2a;color:#fff;min-width:110px}
.row button.active{background:#fff;color:#000}
.pills{display:flex;gap:10px;margin-top:12px}
.pills div{padding:12px 20px;border-radius:20px;font-weight:900;flex:1;text-align:center}
.preview{margin-top:15px;background:#000;border-radius:16px;height:220px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.circle{width:160px;height:160px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#ff2d95);display:flex;align-items:center;justify-content:center;font-size:50px;font-weight:900;box-shadow:0 0 40px #ff2d95}
.dl{margin-top:15px;width:100%;background:#ff2d95;color:#fff;border:none;padding:16px;border-radius:20px;font-weight:900;font-size:16px}
</style>
</head>
<body>
<div class="header">
<div class="logo">ANIME<span>VERSE</span> <span class="badge">8033 FIXED</span></div>
<a class="yt" href="#">▶️ YT</a>
</div>

<div class="box">
<div><b>REAL PICS: <span id="count">0</span>/100</b> <span class="save">SAVED</span><div class="small">Har 45 sec me 1 pic - Reload pe bhi save rahega</div></div>
<div><div class="timer" id="timer">3s</div><div style="text-align:center;margin-top:6px"><button onclick="clearPics()" style="background:#222;color:#fff;border:none;padding:4px 10px;border-radius:10px;font-size:11px">CLEAR</button></div></div>
</div>

<div class="btn-row">
<button>FIND NAME</button><button>50 BOYS</button><button>50 GIRLS</button><button>BANNER</button><button class="active">LOGO</button>
</div>

<div class="card">
<h2>LOGO MAKER - NORMAL + 100 FANCY</h2>
<input id="nameInput" class="input" placeholder="Naam daal - Soumya" oninput="makeLogo()">
<div class="row">
<button class="active" onclick="setMode('normal',this)">NORMAL LOGO</button>
<button onclick="setMode('fancy',this)">100 FANCY LOGO</button>
</div>
<div class="pills">
<div style="background:#fff;color:#000" id="p1">S</div>
<div style="background:#ff2d95;color:#fff" id="p2">SO</div>
<div style="background:#00e5ff;color:#000" id="p3">ANIME</div>
<div style="background:#ffcc00;color:#000" id="p4">5191</div>
</div>
<div class="preview"><div class="circle" id="logoPrev">S</div></div>
<button class="dl" onclick="downloadLogo()">⬇️ DOWNLOAD LOGO</button>
</div>

<script>
let mode='normal';
let saved=JSON.parse(localStorage.getItem('anime_pics')||'[]');
document.getElementById('count').innerText=saved.length;
let fancyStyles=["𝕊𝕠𝕦𝕞𝕪𝕒","𝓢𝓸𝓾𝓶𝔂𝓪","🅂🄾🅄🄼🅈🄰","Sᴏᴜᴍʏᴀ","ꜱᴏᴜᴍʏᴀ"];
function setMode(m,btn){mode=m;document.querySelectorAll('.row button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');makeLogo()}
function makeLogo(){
let n=document.getElementById('nameInput').value||'S';
if(mode==='normal'){document.getElementById('logoPrev').innerText=n.charAt(0).toUpperCase(); document.getElementById('p1').innerText=n.charAt(0).toUpperCase(); document.getElementById('p2').innerText=n.substring(0,2).toUpperCase(); document.getElementById('p3').innerText='ANIME'; document.getElementById('p4').innerText='5191';}
else{let f=fancyStyles[Math.floor(Math.random()*fancyStyles.length)];document.getElementById('logoPrev').innerText=f;}}
function downloadLogo(){
let canvas=document.createElement('canvas');canvas.width=500;canvas.height=500;let ctx=canvas.getContext('2d');
let grad=ctx.createRadialGradient(250,250,0,250,250,250);grad.addColorStop(0,'#ff2d95');grad.addColorStop(1,'#a855f7');
ctx.fillStyle=grad;ctx.beginPath();ctx.arc(250,250,200,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff';ctx.font='bold 100px Arial';ctx.textAlign='center';ctx.fillText(document.getElementById('logoPrev').innerText,250,285);
let a=document.createElement('a');a.download='animeverse-logo.png';a.href=canvas.toDataURL();a.click();
}
function clearPics(){localStorage.removeItem('anime_pics');document.getElementById('count').innerText='0'}
// timer demo
let t=3;setInterval(()=>{t--; if(t<=0)t=45; document.getElementById('timer').innerText=t+'s';},1000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
