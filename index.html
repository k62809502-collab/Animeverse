<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soumya - 1000 Real Fonts</title>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07080f;color:#fff;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:99;background:#07080f;border-bottom:1px solid #ffffff15;padding:10px 4%;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.logo{font-family:'Audiowide';font-size:20px}.logo span{color:#ff0055}
.top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.top input{background:#151725;border:1px solid #ffffff22;color:#fff;padding:10px 14px;border-radius:999px;width:140px;outline:none}
.btn{background:linear-gradient(90deg,#ff0055,#ff6a00);border:none;color:#fff;padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px}
.btn2{background:#151725;border:1px solid #ffffff22;color:#fff;padding:10px 14px;border-radius:999px;cursor:pointer;font-size:13px}
.upload{background:#151725;border:1px dashed #ffffff33;padding:10px 14px;border-radius:999px;cursor:pointer;font-size:12px}.upload input{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px;padding:10px 4%}
.card{background:#151725;border-radius:10px;min-height:80px;display:grid;place-items:center;padding:8px;position:relative;overflow:hidden;border:1px solid #ffffff0d;cursor:pointer}
.card:hover{border-color:#ff0055;transform:translateY(-2px)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.3}
.card .txt{position:relative;z-index:2;font-size:16px;text-align:center;word-break:break-all}
.banner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:10px 4%}
.banner{height:115px;border-radius:10px;display:grid;place-items:center;position:relative;overflow:hidden;border:1px solid #ffffff0d;cursor:pointer}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.5}
.banner .bt{position:relative;z-index:2;font-family:Audiowide;font-size:18px;text-shadow:0 2px 6px #000;text-align:center}
.logo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;padding:10px 4%}
.logo-card{aspect-ratio:1;background:#151725;border-radius:10px;display:grid;place-items:center;position:relative;overflow:hidden;border:1px solid #ffffff0d;cursor:pointer}
.logo-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.4}
.logo-card .lt{position:relative;z-index:2;font-family:Audiowide;text-align:center;font-size:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#ff0055;color:#fff;padding:10px 18px;border-radius:999px;display:none;z-index:999;font-size:13px}

<div class="logo">FONT <span>STUDIO</span></div>
<div class="top">
<input id="nameInput" value="Soumya" placeholder="Name likho">
<label class="upload">📸 Photo<input type="file" id="photo" accept="image/*"></label>
<button class="btn" onclick="genAll()">✨ Generate 1000 Fonts</button>
<button class="btn2" onclick="genBanners()">🎨 Banner/Logo 500</button>
</div>

const styleKeys=Object.keys(fontStyles);
const bgs=['linear-gradient(135deg,#ff0055,#ff6a00)','linear-gradient(135deg,#00f5ff,#0066ff)','linear-gradient(135deg,#ffcc00,#ff3300)','linear-gradient(135deg,#00ff88,#00ccff)','linear-gradient(135deg,#8a5cf5,#ff4ecd)','linear-gradient(135deg,#1a1a1a,#3a3a3a)'];
function toStyle(str,style){let map=fontStyles[style];if(!map)return str;return str.split('').map(ch=>map[ch]||ch).join('');}
function showToast(t){let x=document.getElementById('toast');x.innerText=t;x.style.display='block';setTimeout(()=>x.style.display='none',1500);}
document.getElementById('photo').addEventListener('change',function(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=function(ev){let img=new Image();img.onload=function(){let c=document.createElement('canvas');let max=400;let w=img.width,h=img.height;if(w>max){h*=max/w;w=max;}if(h>max){w*=max/h;h=max;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);pic=c.toDataURL('image/jpeg',0.6);genAll();showToast('Photo lag gayi! Smooth hai');};img.src=ev.target.result;};r.readAsDataURL(f);
});
function genAll(){cur=document.getElementById('nameInput').value||"Soumya";genFonts();genBanners();}
function genFonts(){
  let g=document.getElementById('g1');g.innerHTML='';
  for(let i=0;i<1000;i++){
    let style=styleKeys[i%styleKeys.length];
    let w=wrappers[i%wrappers.length];
    let styledName=toStyle(cur,style);
    let txt=w[0]+styledName+w[1];
    let bg=bgs[i%bgs.length];
    let d=document.createElement('div');d.className='card';d.style.background=bg;
    d.innerHTML=(pic?`<img src="${pic}" loading="lazy">`:'')+`<div class="txt">${txt}</div>`;
    d.onclick=((t)=>()=>{navigator.clipboard.writeText(t);showToast('Copied: '+t);})(txt);
    g.appendChild(d);
  }
}
function genBanners(){
  let g2=document.getElementById('g2');let g3=document.getElementById('g3');g2.innerHTML='';g3.innerHTML='';
  for(let i=0;i<500;i++){
    let bg=bgs[i%bgs.length];let w=wrappers[i%wrappers.length];
    let style=styleKeys[i%styleKeys.length];
    let styledName=toStyle(cur,style);
    let txt=w[0]+styledName+w[1];
    let b=document.createElement('div');b.className='banner';b.style.background=bg;
    b.innerHTML=(pic?`<img src="${pic}" loading="lazy">`:'')+`<div class="bt">${txt}</div>`;
    b.onclick=((t)=>()=>{navigator.clipboard.writeText(t);showToast('Copied: '+t);})(txt);g2.appendChild(b);
    let l=document.createElement('div');l.className='logo-card';l.style.background=bg;
    l.innerHTML=(pic?`<img src="${pic}" loading="lazy">`:'')+`<div class="lt">${styledName.charAt(0)}<br><small style="font-size:9px">${cur}</small></div>`;

  }
}
genAll();
