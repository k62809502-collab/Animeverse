<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMEVERSE 500 BANNER 500 LOGO AESTHETIC</title>
<style>
body{background:#08080c;color:#fff;font-family:Arial;padding:10px;margin:0}

.banner-item{height:92px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer;border:2px solid #222;position:relative;overflow:hidden;background-size:cover;background-position:center;background:#111}

.logo-item.sel{border-color:#fff;box-shadow:0 0 18px rgba(255,255,255,0.5);transform:scale(1.05)}
.inp{width:100%;padding:13px;border-radius:30px;border:none;text-align:center;font-weight:900;background:#1e1e2a;color:#fff;outline:none}
.upload-box{border:2px dashed #333;border-radius:16px;padding:18px;text-align:center;background:#0e0e14;margin-top:10px;cursor:pointer}
.pic{width:100%;height:140px;object-fit:cover;border-radius:12px;background:#111}

<body>

<center><h2>ANIME<span style="color:#ff2d95">VERSE</span> <span style="background:#00ff88;color:#000;font-size:9px;padding:5px 12px;border-radius:20px">500 BANNER + 500 LOGO AESTHETIC</span></h2></center>

<div class="card" style="border-color:#00ff88">
<b>📸 UPLOAD ANIME PIC</b><div style="font-size:11px;color:#666">Log upload karenge → Banner/Logo me lagega</div>
<input type="file" id="animeUpload" accept="image/*" multiple style="display:none" onchange="handleUpload(this)">
<div class="upload-box" onclick="document.getElementById('animeUpload').click()"><b>📤 Click to Upload Anime Pics</b><div style="font-size:11px;color:#666">100 pics save hoga</div></div>
<div id="uploadedGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px"></div>
</div>

<div style="text-align:center;margin-top:12px">
<button onclick="openTab('names',this)" class="btn tab">1000 NAMES</button>
<button onclick="openTab('banner',this)" class="btn tab active">500 BANNER AESTHETIC</button>
<button onclick="openTab('logo',this)" class="btn tab">500 LOGO AESTHETIC</button>
</div>

<div id="tab-names" class="card" style="display:none">
<h4 style="margin:0">1000 FANCY NAME STYLES</h4>
<input id="nameInput" class="inp" style="margin-top:10px" placeholder="Naam - Naruto" oninput="make1000()">
<div id="names1000List" style="margin-top:10px;max-height:500px;overflow:auto"></div>
</div>

<div id="tab-banner" class="card">
<h4 style="margin:0">500 AESTHETIC BANNER STYLES - Har ek alag design</h4>
<input id="bannerText" class="inp" style="margin-top:10px" placeholder="Banner Text - ANIMEVERSE" oninput="updateBanner()">
<div id="bannerDesigns" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px"></div>
<div id="bannerMainPrev" style="margin-top:14px;height:150px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;letter-spacing:2px;background:#111;border:1px solid #333;overflow:hidden;background-size:cover;background-position:center"><span id="bannerMainText">ANIMEVERSE</span></div>
<button onclick="dlBanner()" class="btn" style="width:100%;background:#fff;color:#000;padding:14px;margin-top:10px">⬇️ DOWNLOAD BANNER</button>
</div>

<div id="tab-logo" class="card" style="display:none">
<h4 style="margin:0">500 AESTHETIC LOGO STYLES - Har ek alag design</h4>
<input id="logoText" class="inp" style="margin-top:10px" placeholder="Logo - N" oninput="updateLogo()">
<div id="logoDesigns" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px"></div>
<div style="margin-top:14px;background:#000;border-radius:20px;height:180px;display:flex;align-items:center;justify-content:center;border:1px solid #222">
<div id="logoMainPrev" style="width:140px;height:140px;border-radius:24px;background:linear-gradient(135deg,#ff2d95,#a855f7);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:44px;overflow:hidden;background-size:cover;background-position:center"><span id="logoMainText">N</span></div>
</div>
<button onclick="dlLogo()" class="btn" style="width:100%;background:#ff2d95;color:#fff;padding:14px;margin-top:10px">⬇️ DOWNLOAD LOGO</button>
</div>

<script>
let uploadedPics=JSON.parse(localStorage.getItem('uploaded_anime_pics')||'[]');
function handleUpload(input){for(let file of input.files){if(uploadedPics.length>=100)break;let r=new FileReader();r.onload=e=>{uploadedPics.unshift(e.target.result);localStorage.setItem('uploaded_anime_pics',JSON.stringify(uploadedPics));renderUploaded();};r.readAsDataURL(file);}}
function renderUploaded(){let g=document.getElementById('uploadedGrid');if(uploadedPics.length==0){g.innerHTML="<div style='grid-column:span 3;text-align:center;color:#444;font-size:11px'>No pics</div>";return;}g.innerHTML=uploadedPics.map((url,i)=>`<div style='position:relative'><img src='${url}' class='pic'><button onclick="selectedUploadedForBanner=uploadedPics[${i}];updateBanner()" style='position:absolute;bottom:4px;left:4px;background:#00ff88;color:#000;border:none;border-radius:10px;padding:3px 6px;font-size:8px;font-weight:900'>BANNER</button><button onclick="selectedUploadedForLogo=uploadedPics[${i}];updateLogo()" style='position:absolute;bottom:4px;right:4px;background:#ff2d95;color:#fff;border:none;border-radius:10px;padding:3px 6px;font-size:8px;font-weight:900'>LOGO</button></div>`).join('');}
renderUploaded();

while(bannerAesthetics.length<500){
let name=extras[(bannerAesthetics.length-41)%extras.length]+" "+(bannerAesthetics.length+1);
let h=Math.floor(Math.random()*360);
bannerAesthetics.push([name.split(' ')[0],name.split(' ').slice(1).join(' ')||" aesthetic",`linear-gradient(135deg,hsl(${h},80%,60%),hsl(${(h+50)%360},80%,45%))`,"1px solid rgba(255,255,255,0.1)"]);

const bannerStyles=bannerAesthetics;
let selBanner=0, selectedUploadedForBanner=null;
function loadBanners(){
document.getElementById('bannerDesigns').innerHTML=bannerStyles.map((b,i)=>`
<div onclick="selBanner=${i};updateBanner()" class='banner-item ${selBanner==i?'sel':''}' style='background:${b[2]};border:${b[3]}'>
<div style='text-align:center;line-height:1.1'>
<div style='font-size:13px;letter-spacing:0.5px'>${b[0]}</div>
<div style='font-size:9px;opacity:0.7;margin-top:3px'>${b[1]}</div>
</div>
</div>`).join('');
updateBanner();
}
function updateBanner(){
let txt=document.getElementById('bannerText').value||'ANIMEVERSE';
let b=bannerStyles[selBanner];
let el=document.getElementById('bannerMainPrev');
el.style.background=b[2]; el.style.border=b[3];
if(selectedUploadedForBanner){el.style.background=`linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.45)), url('${selectedUploadedForBanner}')`;el.style.backgroundSize='cover';el.style.backgroundPosition='center';}
document.getElementById('bannerMainText').innerText=txt+" • "+b[0];
}
function dlBanner(){let c=document.createElement('canvas');c.width=1280;c.height=400;let x=c.getContext('2d');let g=x.createLinearGradient(0,0,1280,0);g.addColorStop(0,'#ff2d95');g.addColorStop(1,'#667eea');x.fillStyle=g;x.fillRect(0,0,1280,400);x.fillStyle='#fff';x.font='900 50px Arial';x.textAlign='center';x.fillText(document.getElementById('bannerText').value||'ANIMEVERSE',640,220);let a=document.createElement('a');a.download='banner.png';a.href=c.toDataURL();a.click();}

["AKATSUKI","linear-gradient(135deg,#000,#e74c3c)","12px","0 0 20px #e74c3c"],
["UCHIHA","linear-gradient(135deg,#200122,#6f0000)","50%","0 0 25px #ff2d95"],
["HOKAGE","linear-gradient(135deg,#ff5f6d,#6a82fb)","18px","0 0 20px #ff5f6d"],

let selLogo=0, selectedUploadedForLogo=null;
function loadLogos(){
let txt=document.getElementById('logoText').value||'N';
document.getElementById('logoDesigns').innerHTML=logoAesthetics.map((l,i)=>`

function dlLogo(){let c=document.createElement('canvas');c.width=600;c.height=600;let x=c.getContext('2d');let g=x.createRadialGradient(300,300,0,300,300,300);g.addColorStop(0,'#ff2d95');g.addColorStop(1,'#667eea');x.fillStyle=g;x.beginPath();x.arc(300,300,250,0,6.28);x.fill();x.fillStyle='#fff';x.font='900 150px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(document.getElementById('logoMainText').innerText,300,320);let a=document.createElement('a');a.download='logo.png';a.href=c.toDataURL();a.click();}

function generate1000(name){let base=name||'Naruto';let fonts=[t=>t,t=>t.toUpperCase(),t=>`꧁${t}꧂`,t=>`★彡${t}彡★`,t=>`༺${t}༻`,t=>`${t}ツ`,t=>`${t}♡`,t=>`『${t}』`,t=>`•°${t}°•`];let out=[];for(let i=0;i<1000;i++){let f=fonts[i%fonts.length];let txt=f(base);if(i>20)txt=txt+` ${i%100}`;out.push(txt);}return out.slice(0,1000);}
function make1000(){let name=document.getElementById('nameInput').value||'Naruto';let list=generate1000(name);document.getElementById('names1000List').innerHTML=list.map(t=>`<span class='fancy' onclick="navigator.clipboard.writeText('${t}')">${t}</span>`).join('');}
