}

function dlBanner(){
let c=document.createElement('canvas');c.width=1280;c.height=400;let x=c.getContext('2d');
let grad=x.createLinearGradient(0,0,1280,0); grad.addColorStop(0,'#ff2d95'); grad.addColorStop(1,'#667eea');

let txt=document.getElementById('logoText').value||'N';

el.style.cssText+=l.style;
}
function dlLogo(){
let c=document.createElement('canvas');c.width=600;c.height=600;let x=c.getContext('2d');
let g=x.createRadialGradient(300,300,0,300,300,300); g.addColorStop(0,'#ff2d95'); g.addColorStop(1,'#a855f7');
