<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animeverse - Watch Anime</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>:root{--bg:#06070d;--card:#12131e;--neon:#8a5cf5;--text:#e8e8ff;--muted:#8b8ca6}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif}
header{position:sticky;top:0;z-index:99;background:rgba(6,7,13,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(138,92,245,0.15);display:flex;justify-content:space-between;align-items:center;padding:14px 5%}
.logo{font-family:'Space Grotesk';font-weight:800;font-size:26px}.logo span{color:var(--neon)}
.search{display:flex;background:var(--card);border-radius:999px;padding:8px 16px;border:1px solid rgba(255,255,255,0.08);width:300px}
.search input{flex:1;background:transparent;border:none;color:white;outline:none}
.search button{background:var(--neon);border:none;color:white;padding:6px 14px;border-radius:999px}
.hero{margin:20px 5%;height:360px;border-radius:20px;background:linear-gradient(100deg,#8a5cf5,#ff4ecd);display:flex;align-items:center;padding:30px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,7,13,0.9) 20%,transparent)}
.hero-content{position:relative;z-index:2;max-width:500px}.hero h1{font-size:40px;font-family:'Space Grotesk'}.hero p{color:var(--muted);margin:10px 0 16px}
.btn{padding:10px 20px;border-radius:999px;border:none;font-weight:700;cursor:pointer}.btn-w{background:white;color:black}.btn-d{background:rgba(255,255,255,0.12);color:white;border:1px solid rgba(255,255,255,0.2)}
.filters{display:flex;gap:10px;padding:10px 5%;overflow-x:auto}.filter{padding:8px 16px;border-radius:999px;background:var(--card);border:1px solid rgba(255,255,255,0.08);cursor:pointer;white-space:nowrap;font-size:13px}.filter.active{background:var(--neon)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:10px 5% 30px}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,0.06);cursor:pointer;position:relative;transition:0.3s}.card:hover{transform:translateY(-5px);border-color:var(--neon)}
.card img{width:100%;height:210px;object-fit:cover}.info{padding:8px 10px}.info h3{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info span{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;margin-top:3px}
.badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.7);font-size:9px;padding:3px 6px;border-radius:999px}.badge.top{background:var(--neon)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);z-index:100;display:none;place-items:center;padding:5%}.modal.active{display:grid}.mbox{background:#0f1020;border:1px solid rgba(138,92,245,0.3);border-radius:16px;max-width:700px;width:100%;overflow:hidden;display:flex;max-height:90vh}.mbox img{width:280px;object-fit:cover}.mdata{padding:18px;overflow-y:auto}.close{position:fixed;top:15px;right:15px;background:var(--card);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
@media(max-width:600px){.hero{height:300px}.hero h1{font-size:28px}.mbox{flex-direction:column}.mbox img{width:100%;height:220px}}
</style></head>
<body>
<header><div class="logo">ANIME<span>VERSE</span></div><div class="search"><input id="s" placeholder="Search anime..." onkeyup="searchA()"><button onclick="searchA()">⌕</button></div></header>
<div class="hero"><div class="hero-content"><h1>WATCH THE UNIVERSE OF ANIME</h1><p>Stream 2000+ anime in HD, no ads. Updated daily.</p><div style="display:flex;gap:8px"><button class="btn btn-w" onclick="document.getElementById('grid').scrollIntoView({behavior:'smooth'})">Explore Now →</button></div></div></div>
<div class="filters"><div class="filter active" onclick="filterA('all',this)">🔥 Trending</div><div class="filter" onclick="filterA('action',this)">⚔️ Action</div><div class="filter" onclick="filterA('romance',this)">❤️ Romance</div><div class="filter" onclick="filterA('comedy',this)">😂 Comedy</div></div>
<div style="padding:10px 5%;display:flex;justify-content:space-between"><span style="font-family:Space Grotesk;font-weight:700">Trending This Week</span><span style="font-size:12px;color:var(--muted)" id="cnt">Loading...</span></div>
<div class="grid" id="grid"></div>
<div class="modal" id="modal" onclick="if(event.target==this)closeM()"><div class="close" onclick="closeM()">✕</div><div class="mbox" id="mbox"></div></div>
<script>
const animes=[
{mal_id:1,title:'One Piece',images:{jpg:{large_image_url:'https://cdn.myanimelist.net/images/anime/1208/94745.jpg'}},score:9.1,type:'TV',episodes:1100,synopsis:'Luffy becomes Pirate King.'},
{mal_id:2,title:'Naruto Shippuden',images:{jpg:{large_image_url:'https://cdn.myanimelist.net/images/anime/5/44560.jpg'}},score:8.7,type:'TV',episodes:500,synopsis:'Naruto protects village.'},
{mal_id:3,title:'Jujutsu Kaisen S2',images:{jpg:{large_image_url:'https://cdn.myanimelist.net/images/anime/1015/138006.jpg'}},score:8.9,type:'TV',episodes:23,synopsis:'Yuji fights curses.'},
{mal_id:4,title:'Solo Leveling',images:{jpg:{large_image_url:'https://cdn.myanimelist.net/images/anime/1792/138022.jpg'}},score:8.3,type:'TV',episodes:12,synopsis:'Weakest hunter becomes strongest.'},
{mal_id:5,title:'Demon Slayer',images:{jpg:{large_image_url:'https://cdn.myanimelist.net/images/anime/1500/139518.jpg'}},score:8.6,type:'TV',episodes:55,synopsis:'Tanjiro fights demons.'},
{mal_id:6,title:'Bleach TYBW',images:{jpg:{large_image_url:'https://cdn.myanimelist.net/images/anime/1160/122627.jpg'}},score:9.0,type:'TV',episodes:26,synopsis:'Blood War begins.'},
{mal_id:7,title:'Your Name',images:{jpg:{large_image_url:'https://cdn.myanimelist.net/images/anime/5/87048.jpg'}},score:8.8,type:'Movie',episodes:1,synopsis:'Two teens swap bodies.'},
{mal_id:8,title:'One Punch Man',images:{jpg:{large_image_url:'https://cdn.myanimelist.net/images/anime/12/76049.jpg'}},score:8.5,type:'TV',episodes:24,synopsis:'Hero with one punch.'},
];
let allAnime=[...animes];
function render(list){document.getElementById('cnt').innerText=list.length+' anime';document.getElementById('grid').innerHTML=list.map((a,i)=>`<div class="card" onclick="openM(${a.mal_id})">${i<3?'<div class="badge top">TOP '+(i+1)+'</div>':'<div class="badge">HD</div>'}<img src="${a.images.jpg.large_image_url}"><div class="info"><h3>${a.title}</h3><span><i>${a.type} • ${a.episodes} Eps</i><i>⭐ ${a.score}</i></span></div></div>`).join('');}
render(allAnime);
function searchA(){const q=document.getElementById('s').value.toLowerCase();if(!q){render(allAnime);return}const f=allAnime.filter(a=>a.title.toLowerCase().includes(q));render(f);}
function filterA(t,el){document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));el.classList.add('active');render(allAnime);}
function openM(id){const a=allAnime.find(x=>x.mal_id==id);document.getElementById('mbox').innerHTML=`<img src="${a.images.jpg.large_image_url}"><div class="mdata"><h2>${a.title}</h2><p style="color:var(--muted);margin:6px 0">⭐ ${a.score} • ${a.type} • ${a.episodes} Eps</p><p style="margin:12px 0;font-size:13px;line-height:1.5">${a.synopsis}</p><div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-w">▶️ Watch Now</button><button class="btn btn-d" onclick="closeM()">Close</button></div></div>`;document.getElementById('modal').classList.add('active');}
function closeM(){document.getElementById('modal').classList.remove('active');}
</script></body></html>
