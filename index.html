<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMEVERSE REAL AESTHETIC</title>
<style>
body{background:#08080b;color:#fff;font-family:Arial;padding:10px;margin:0}
.btn{padding:10px 14px;border-radius:20px;border:none;font-weight:900;margin:3px;cursor:pointer;font-size:11px}
.tab{background:#1a1a22;color:#666;border:1px solid #222}.tab.active{background:#fff;color:#000}
.card{background:#11111a;border:1px solid #23232f;border-radius:20px;padding:14px;margin-top:12px}
.anime-card{background:#0c0c12;border:1px solid #222;border-radius:16px;overflow:hidden}
.anime-pic{width:100%;height:220px;object-fit:cover;background:#111}
.banner-card{height:80px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;cursor:pointer;background-size:cover;background-position:center;border:2px solid #222}
.banner-card.selected{border-color:#fff}
.logo-card{height:85px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;cursor:pointer;border:2px solid #222}
.inp{width:100%;padding:13px;border-radius:30px;border:none;text-align:center;font-weight:900;background:#1e1e2a;color:#fff}
</style>
</head>
<body>
<center><h2>ANIME<span style="color:#ff2d95">VERSE</span> <span style="background:#fff;color:#000;font-size:8px;padding:4px 10px;border-radius:20px">REAL ANIME</span></h2>
<div style="font-size:11px;color:#666;margin-top:-8px">No building pics - Only anime!</div></center>

<div style="text-align:center;margin-top:12px">
<button onclick="openTab('boys',this)" class="btn tab active">50 ANIME BOYS</button>
<button onclick="openTab('girls',this)" class="btn tab">50 ANIME GIRLS</button>
<button onclick="openTab('banner',this)" class="btn tab">100 AESTHETIC BANNER</button>
<button onclick="openTab('logo',this)" class="btn tab">100 AESTHETIC LOGO</button>
</div>

<div id="tab-boys" class="card">
<h4 style="margin:0">50 ANIME BOYS - Real Characters</h4>
<div style="font-size:11px;color:#666">Auto real anime pics from API - Naruto, Gojo, Luffy, Levi</div>
<div id="boysGrid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px"></div>
</div>

<div id="tab-girls" class="card" style="display:none">
<h4 style="margin:0">50 ANIME GIRLS - Real Characters</h4>
<div id="girlsGrid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px"></div>
</div>

<div id="tab-banner" class="card" style="display:none">
<h4 style="margin:0">100 AESTHETIC BANNERS</h4>
<input id="bannerText" class="inp" style="margin-top:8px" placeholder="ANIMEVERSE" oninput="updateBanner()">
<div id="bannerDesigns" style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px"></div>
<div id="bannerMainPrev" style="margin-top:14px;height:130px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;background:linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.3)),url('https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=800');background-size:cover;border:1px solid #333">ANIMEVERSE</div>
<button onclick="dlBanner()" class="btn" style="width:100%;background:#fff;color:#000;padding:14px;margin-top:10px">⬇️ GENERATE</button>
</div>

<div id="tab-logo" class="card" style="display:none">
<h4 style="margin:0">100 AESTHETIC LOGOS</h4>
<input id="logoText" class="inp" style="margin-top:8px" placeholder="N" oninput="updateLogo()">
<div id="logoDesigns" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px"></div>
<div style="margin-top:14px;background:#000;border-radius:20px;height:170px;display:flex;align-items:center;justify-content:center;border:1px solid #222">
<div id="logoMainPrev" style="width:130px;height:130px;border-radius:24px;background:linear-gradient(135deg,#ff2d95,#a855f7);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:36px;box-shadow:0 0 30px rgba(255,45,149,0.6)">N</div>
</div>
<button onclick="dlLogo()" class="btn" style="width:100%;background:#ff2d95;color:#fff;padding:14px;margin-top:10px">⬇️ DOWNLOAD</button>
</div>

<script>
function openTab(n,btn){
['boys','girls','banner','logo'].forEach(k=>document.getElementById('tab-'+k).style.display='none');
document.getElementById('tab-'+n).style.display='block';
document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
if(btn)btn.classList.add('active');
if(n=='boys') loadBoys(); if(n=='girls') loadGirls(); if(n=='banner') loadBanners(); if(n=='logo') loadLogos();
}
const animeBoysNames=["Naruto Uzumaki","Sasuke Uchiha","Satoru Gojo","Monkey D Luffy","Roronoa Zoro","Levi Ackerman","Eren Yeager","Son Goku","Itachi Uchiha","Kakashi Hatake","Tanjiro Kamado","Zenitsu Agatsuma","Killua Zoldyck","Gon Freecss","L Lawliet","Light Yagami","Ichigo Kurosaki","Ken Kaneki","Saitama","Edward Elric","Lelouch Lamperouge","Vegeta","Sanji","Trafalgar Law","Megumi Fushiguro","Yuji Itadori","Sukuna","Armin Arlert","Deku Midoriya","Bakugo Katsuki","Shoto Todoroki","Kyojuro Rengoku","Giyu Tomioka","Asta","Yuno","Obito Uchiha","Madara Uchiha","Minato Namikaze","Pain","Portgas D Ace","Sabo","Mihawk","Gohan","Trunks","Nanami Kento","Toji Fushiguro","Suguru Geto","Inosuke Hashibira","Gojo 2","Naruto 2"];
const animeGirlsNames=["Nezuko Kamado","Mikasa Ackerman","Zero Two","Marin Kitagawa","Anya Forger","Hinata Hyuga","Sakura Haruno","Nobara Kugisaki","Boa Hancock","Nami","Rem","Emilia","Power","Makima","Asuna Yuuki","Violet Evergarden","Mai Sakurajima","Miku Nakano","Shinobu Kocho","Mitsuri Kanroji","Kanao Tsuyuri","Sailor Moon","Yor Forger","Chizuru Mizuhara","Kurisu Makise","Kaguya Shinomiya","Chika Fujiwara","Mami Nanami","Rias Gremory","Akeno Himejima","Erza Scarlet","Lucy Heartfilia","Uraraka Ochaco","Momo Yaoyorozu","Tsuyu Asui","Kobeni","Ram","Emilia 2","Zero Two 2","Marin 2","Anya 2","Robin Nico","Violet 2","Power 2","Makima 2","Nezuko 2","Mikasa 2","Zero Two 3","Marin 3","Anya 3"];

async function loadBoys(){
let grid=document.getElementById('boysGrid');
grid.innerHTML=animeBoysNames.map((name,i)=>`<div class='anime-card'><img class='anime-pic' id='boy${i}' src='https://i.waifu.pics/loading.jpg'><div style='padding:10px'><div style='font-weight:900;font-size:13px;text-align:center'>${name}</div><div style='display:flex;gap:6px;margin-top:8px'><button onclick="loadSingleBoy(${i})" class='btn' style='flex:1;background:#fff;color:#000'>🔄 REAL ANIME PIC</button></div></div></div>`).join('');
for(let i=0;i<15;i++) loadSingleBoy(i);
}
async function loadSingleBoy(i){
try{let res=await fetch('https://nekos.best/api/v2/husbando');let data=await res.json();document.getElementById('boy'+i).src=data.results[0].url;}catch(e){let r2=await fetch('https://api.waifu.pics/sfw/waifu');let d2=await r2.json();document.getElementById('boy'+i).src=d2.url;}
}
async function loadGirls(){
let grid=document.getElementById('girlsGrid');
grid.innerHTML=animeGirlsNames.map((name,i)=>`<div class='anime-card'><img class='anime-pic' id='girl${i}' src=''><div style='padding:10px'><div style='font-weight:900;font-size:13px;text-align:center'>${name}</div><div style='display:flex;gap:6px;margin-top:8px'><button onclick="loadSingleGirl(${i})" class='btn' style='flex:1;background:#ff2d95;color:#fff'>🔄 REAL ANIME PIC</button></div></div></div>`).join('');
for(let i=0;i<15;i++) loadSingleGirl(i);
}
async function loadSingleGirl(i){
try{let res=await fetch('https://api.waifu.pics/sfw/waifu');let data=await res.json();document.getElementById('girl'+i).src=data.url;}catch(e){document.getElementById('girl'+i).src='https://i.waifu.pics/failed.jpg';}
}

const aestheticBannersList=[
{ name:"Sakura Pink", style:"linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.3)), url('https://images.unsplash.com/photo-1522383225653-ed111181a951?w=600')" },
{ name:"Neon Tokyo", style:"linear-gradient(rgba(15,12,41,0.8), rgba(48,43,99,0.8)), url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=600')" },
{ name:"Sunset Anime", style:"linear-gradient(135deg, #ff6a00, #ee0979)" },
{ name:"Midnight Blue", style:"linear-gradient(135deg, #0f0c29, #302b63, #24243e)" },
{ name:"Pastel Dream", style:"linear-gradient(135deg, #a8edea, #fed6e3)" },
{ name:"Cyber Pink", style:"linear-gradient(135deg, #f857a6, #ff5858)" },
{ name:"Aesthetic Purple", style:"linear-gradient(135deg, #667eea, #764ba2)" },
{ name:"Ocean Blue", style:"linear-gradient(135deg, #2193b0, #6dd5ed)" },
];
while(aestheticBannersList.length<100){ let h=Math.floor(Math.random()*360); aestheticBannersList.push({ name:`Aesthetic ${aestheticBannersList.length}`, style:`linear-gradient(135deg, hsl(${h},80%,65%), hsl(${(h+40)%360},80%,55%))` }); }
let selBanner=0;
function loadBanners(){
let txt=document.getElementById('bannerText').value||'ANIMEVERSE';
document.getElementById('bannerDesigns').innerHTML=aestheticBannersList.map((b,i)=>`<div onclick="selBanner=${i};updateBanner()" class='banner-card ${selBanner==i?'selected':''}' style='background:${b.style};background-size:cover'><span style='background:rgba(0,0,0,0.5);padding:6px 12px;border-radius:20px;backdrop-filter:blur(8px)'>${b.name}</span></div>`).join('');
updateBanner();
}
function updateBanner(){ let txt=document.getElementById('bannerText').value||'ANIMEVERSE'; let b=aestheticBannersList[selBanner]; document.getElementById('bannerMainPrev').innerText=txt; document.getElementById('bannerMainPrev').style.background=b.style; document.getElementById('bannerMainPrev').style.backgroundSize='cover'; }
function dlBanner(){ let c=document.createElement('canvas');c.width=1280;c.height=400;let x=c.getContext('2d'); let grad=x.createLinearGradient(0,0,1280,0); grad.addColorStop(0,'#ff2d95'); grad.addColorStop(1,'#667eea'); x.fillStyle=grad; x.fillRect(0,0,1280,400); x.fillStyle='#fff';x.font='900 70px Arial';x.textAlign='center'; x.fillText(document.getElementById('bannerMainPrev').innerText,640,230); let a=document.createElement('a');a.download='banner.png';a.href=c.toDataURL();a.click(); }

const aestheticLogosList=[
{ bg:"radial-gradient(circle, #ff2d95, #a855f7)", radius:"24px", shadow:"0 0 30px #ff2d95" },
{ bg:"linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05))", radius:"24px", shadow:"0 0 0" },
{ bg:"linear-gradient(135deg, #00c6ff, #0072ff)", radius:"50%", shadow:"0 0 30px #00c6ff" },
{ bg:"linear-gradient(135deg, #ffafbd, #ffc3a0)", radius:"20px", shadow:"0 0 20px #ffafbd" },
];
while(aestheticLogosList.length<100){ let h=Math.floor(Math.random()*360); aestheticLogosList.push({ bg:`linear-gradient(135deg, hsl(${h},90%,65%), hsl(${(h+30)%360},85%,60%))`, radius:`${16+Math.floor(Math.random()*20)}px`, shadow:`0 0 25px hsl(${h},80%,60%)` }); }
let selLogo=0;
function loadLogos(){ let txt=document.getElementById('logoText').value||'N'; document.getElementById('logoDesigns').innerHTML=aestheticLogosList.map((l,i)=>`<div onclick="selLogo=${i};updateLogo()" class='logo-card' style='background:${l.bg};border-radius:${l.radius};box-shadow:${selLogo==i?l.shadow:'none'};border-color:${selLogo==i?'#fff':'#222'}'><span style='background:rgba(0,0,0,0.3);width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:50%;backdrop-filter:blur(10px)'>${txt.charAt(0)}</span></div>`).join(''); updateLogo(); }
function updateLogo(){ let txt=document.getElementById('logoText').value||'N'; let l=aestheticLogosList[selLogo]; document.getElementById('logoMainPrev').innerText=txt.charAt(0).toUpperCase(); document.getElementById('logoMainPrev').style.background=l.bg; document.getElementById('logoMainPrev').style.borderRadius=l.radius; document.getElementById('logoMainPrev').style.boxShadow=l.shadow; }
function dlLogo(){ let c=document.createElement('canvas');c.width=600;c.height=600;let x=c.getContext('2d'); let g=x.createRadialGradient(300,300,0,300,300,300); g.addColorStop(0,'#ff2d95'); g.addColorStop(1,'#667eea'); x.fillStyle=g; x.beginPath(); x.arc(300,300,250,0,6.28); x.fill(); x.fillStyle='#fff';x.font='900 150px Arial';x.textAlign='center';x.textBaseline='middle'; x.fillText(document.getElementById('logoMainPrev').innerText,300,320); let a=document.createElement('a');a.download='logo.png';a.href=c.toDataURL();a.click(); }

loadBoys(); loadBanners(); loadLogos();
</script>
</body>
</html>
