<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soumya Studio - Fixed</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Audiowide&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06070d;color:#e8e8ff;font-family:Outfit,sans-serif}
header{position:sticky;top:0;z-index:99;background:rgba(6,7,13,0.98);backdrop-filter:blur(20px);border-bottom:1px solid #8a5cf522;padding:12px 4%;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.logo{font-family:Space Grotesk;font-size:20px;font-weight:800}.logo span{color:#8a5cf5}
.top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.top input{background:#12131e;border:1px solid #ffffff22;color:#fff;padding:11px 14px;border-radius:999px;width:150px}
.btn{background:linear-gradient(90deg,#8a5cf5,#ff4ecd);border:none;color:#fff;padding:11px 18px;border-radius:999px;cursor:pointer;font-weight:700}
.btn2{background:#12131e;border:1px solid #ffffff22;color:#fff;padding:11px 14px;border-radius:999px;cursor:pointer}
.upload{background:#12131e;border:1px dashed #ffffff44;padding:11px 14px;border-radius:999px;cursor:pointer;font-size:12px}.upload input{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:10px 4%}
.card{background:#12131e;border-radius:12px;min-height:90px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px;position:relative;overflow:hidden;border:1px solid #ffffff11;cursor:pointer;transition:0.2s}
.card:hover{transform:translateY(-4px);border-color:#8a5cf5}
.card .txt{font-size:17px;text-align:center;word-break:break-all;z-index:2}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.25}
.banner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding:10px 4%}
.banner{height:140px;border-radius:12px;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;border:1px solid #ffffff11;cursor:pointer;transition:0.2s}
.banner:hover{transform:scale(1.02);border-color:#00f5ff}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.6}
.banner .bt{font-family:Audiowide;font-size:20px;z-index:2;text-shadow:0 2px 10px #000}
.logo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:10px 4%}
.logo-card{aspect-ratio:1;background:#12131e;border-radius:12px;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;border:1px solid #ffffff11;cursor:pointer}
.logo-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.5}
.logo-card .lt{font-family:Audiowide;text-align:center;z-index:2}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#8a5cf5,#ff4ecd);color:#fff;padding:12px 20px;border-radius:999px;display:none;z-index:999}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(15px);z-index:1000;display:none;place-items:center;padding:20px}.modal.active{display:grid}
.mbox{background:#12131e;border:1px solid #8a5cf533;border-radius:20px;padding:20px;max-width:500px;width:100%;text-align:center}
.action-btn{background:rgba(0,0,0,0.8);border:1px solid #ffffff33;color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;cursor:pointer;z-index:5}
.card-actions{position:absolute;bottom:5px;right:5px;display:flex;gap:4px;z-index:4}
</style></head><body>
<header>
<div class="logo">ANIME<span>VERSE</span> + SOUMYA</div>
<div class="top">
<input id="nameInput" value="Soumya" placeholder="Name likho...">
<label class="upload">📸 Photo<input type="file" accept="image/*" onchange="loadPhoto(event)"></label>
<button class="btn" onclick="genAll()">✨ Generate 1000</button>
<button class="btn2" onclick="genBanners()">🎨 Banner/Logo 500</button>
</div>
</header>

<div style="margin:12px 4%;background:linear-gradient(135deg,#1a0a2e,#3d0a3d);border-radius:16px;padding:18px;border:1px solid #8a5cf522">
<h1 style="font-family:Space Grotesk">FIXED CLICK VERSION</h1>
<p style="color:#8b8ca6;font-size:12px">Ab banner/logo pe click 100% kaam karega! Click = Copy + Preview popup.</p>
</div>

<div style="padding:10px 4%;font-weight:700;display:flex;justify-content:space-between"><span>🔥 1000 Fonts</span><span style="font-size:11px;color:#8b8ca6;cursor:pointer" onclick="copyAll()">📋 Copy All</span></div>
<div class="grid" id="g1"></div>
<div style="padding:10px 4%;font-weight:700">🎨 500 Banners</div>
<div class="banner-grid" id="g2"></div>
<div style="padding:10px 4%;font-weight:700">🔰 500 Logos</div>
<div class="logo-grid" id="g3"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" onclick="closeModal()"><div class="mbox" id="mbox" onclick="event.stopPropagation()"></div></div>

<script>
const wrappers = [
['꧁༒','༒꧂'],['亗 ',' 亗'],['『','』ツ'],['★彡[',']彡★'],['𓆩','𓆪'],['♛ ',' ♛'],['⚡','⚡'],['乂 ',' 乂'],['么','么'],['☠︎︎ ',' ☠︎︎'],['♡ ',' ♡'],['✿ ',' ✿'],['᭄','࿐'],['꧁ঔৣ','ঔৣ꧂'],['【','】'],['◥','◤'],['★','★'],['彡','彡'],['༺','༻'],['ツ','ツ'],['♜ ',' ♜'],['☯ ',' ☯'],['✧','✧'],['⫷','⫸'],['×͜× ',' ×͜×'],['乛','乛'],['☬','☬'],['♠ ',' ♠'],['༒ ',' ༒'],['◈ ',' ◈'],['•','•'],['ꜰꜰ ',''],['꧁','꧂'],['🔥 ',' 🔥'],['💀 ',' 💀'],['👑 ',' 👑'],['⚔️ ',' ⚔️']
];
const bgs=['linear-gradient(135deg,#ff0055,#ff6a00)','linear-gradient(135deg,#00f5ff,#0066ff)','linear-gradient(135deg,#ffcc00,#ff3300)','linear-gradient(135deg,#00ff88,#00ccff)','linear-gradient(135deg,#8a5cf5,#ff4ecd)','linear-gradient(135deg,#1a1a1a,#3a3a3a)','linear-gradient(135deg,#1a0a2e,#ff0055)'];
let curName="Soumya";let pic=null;
function loadPhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{pic=x.target.result;genAll();};r.readAsDataURL(f);}
function showToast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000);}
function copyText(t){navigator.clipboard.writeText(t).then(()=>showToast('Copied: '+t)).catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('Copied: '+t);});}
function openPreview(text,bg){const m=document.getElementById('modal');const b=document.getElementById('mbox');b.innerHTML='<div style="font-size:12px;color:#8b8ca6">PREVIEW</div><div style="background:'+bg+';padding:30px;border-radius:12px;font-size:28px;margin:12px 0;word-break:break-all">'+(pic?'<img src="'+pic+'" style="width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:10px">':'')+'<div>'+text+'</div></div><button class="btn" onclick="closeModal()">Close</button>';m.classList.add('active');}
function closeModal(){document.getElementById('modal').classList.remove('active');}
function genAll(){curName=document.getElementById('nameInput').value.trim()||"Soumya";genFonts();genBanners();}
function genFonts(){
  const g=document.getElementById('g1');g.innerHTML='';
  for(let i=0;i<1000;i++){
    let w=wrappers[i%wrappers.length];
    let styled=w[0]+curName+w[1];
    let bg=bgs[i%bgs.length];
    let card=document.createElement('div');card.className='card';card.style.background=bg;
    let txt=document.createElement('div');txt.className='txt';txt.innerText=styled;
    card.appendChild(txt);
    if(pic){let img=document.createElement('img');img.src=pic;card.appendChild(img);}
    let actions=document.createElement('div');actions.className='card-actions';
    let cb=document.createElement('div');cb.className='action-btn';cb.innerText='📋';cb.onclick=(e)=>{e.stopPropagation();copyText(styled);};
    let vb=document.createElement('div');vb.className='action-btn';vb.innerText='👁️';vb.onclick=(e)=>{e.stopPropagation();openPreview(styled,bg);};
    actions.appendChild(cb);actions.appendChild(vb);card.appendChild(actions);
    card.onclick=()=>{copyText(styled);openPreview(styled,bg);};
    g.appendChild(card);
  }
}
function genBanners(){
  const g2=document.getElementById('g2');const g3=document.getElementById('g3');g2.innerHTML='';g3.innerHTML='';
  for(let i=0;i<500;i++){
    let bg=bgs[i%bgs.length];
    let w=wrappers[i%wrappers.length];
    let txt=w[0]+curName+w[1];
    let b=document.createElement('div');b.className='banner';b.style.background=bg;
    if(pic){let img=document.createElement('img');img.src=pic;b.appendChild(img);}
    let bt=document.createElement('div');bt.className='bt';bt.innerText=txt;b.appendChild(bt);
    let btns=document.createElement('div');btns.className='card-actions';btns.style.bottom='8px';btns.style.right='8px';
    let c1=document.createElement('div');c1.className='action-btn';c1.innerText='📋';c1.onclick=(e)=>{e.stopPropagation();copyText(txt);};
    let c2=document.createElement('div');c2.className='action-btn';c2.innerText='👁️';c2.onclick=(e)=>{e.stopPropagation();openPreview(txt,bg);};
    btns.appendChild(c1);btns.appendChild(c2);b.appendChild(btns);
    b.onclick=()=>{copyText(txt);openPreview(txt,bg);};
    g2.appendChild(b);
    let l=document.createElement('div');l.className='logo-card';l.style.background=bg;
    if(pic){let img=document.createElement('img');img.src=pic;l.appendChild(img);}
    let lt=document.createElement('div');lt.className='lt';lt.innerHTML=txt.charAt(0).toUpperCase()+'<br><small style="font-size:9px">'+curName+'</small>';l.appendChild(lt);
    let lb=document.createElement('div');lb.className='card-actions';
    let lc=document.createElement('div');lc.className='action-btn';lc.innerText='📋';lc.onclick=(e)=>{e.stopPropagation();copyText(txt);};
    lb.appendChild(lc);l.appendChild(lb);
    l.onclick=()=>{copyText(txt);openPreview(txt,bg);};
    g3.appendChild(l);
  }
}
function copyAll(){
  let all='';
  for(let i=0;i<1000;i++){let w=wrappers[i%wrappers.length];all+=w[0]+curName+w[1]+'\\n';}
  copyText(all);showToast('1000 Copied!');
}
genAll();
</script></body></html>
