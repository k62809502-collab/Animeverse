<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMEVERSE 8033 ULTIMATE 500</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:10px;margin:0}
.btn{padding:10px 14px;border-radius:20px;border:none;font-weight:900;margin:3px;cursor:pointer;font-size:11px}
.tab{background:#1a1a1a;color:#888}.tab.active{background:#fff;color:#000}
.card{background:#141414;border:1px solid #222;border-radius:18px;padding:14px;margin-top:12px}
.inp{width:100%;padding:12px;border-radius:30px;border:none;text-align:center;font-weight:900;outline:none}
.fancy{display:inline-block;padding:6px 10px;background:#222;border-radius:10px;margin:3px;font-size:12px;cursor:pointer}
.pic{width:100%;height:140px;object-fit:cover;border-radius:12px;background:#222}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.logoPrev{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;margin:auto}
.bannerPrev{height:110px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
.social{padding:10px 18px;border-radius:20px;text-decoration:none;font-weight:900;font-size:12px;display:inline-block;margin:3px}
</style>
</head>
<body>

<div style="background:#0f0f0f;border:1px solid #222;border-radius:16px;padding:12px;display:flex;justify-content:space-between;align-items:center">
<b>ANIME<span style="color:#ff2d95">VERSE</span> <span style="background:#fff;color:#000;font-size:8px;padding:2px 8px;border-radius:20px">8033 500 STYLES</span></b>
<div>
<a id="ytLink" href="https://youtube.com/@YOUR_CHANNEL" target="_blank" class="social" style="background:red;color:#fff">▶️ YT</a>
<a id="instaLink" href="https://instagram.com/YOUR_ID" target="_blank" class="social" style="background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);color:#fff">📸 INSTA</a>
</div>
</div>

<div class="card" style="border-color:#00ff88;display:flex;justify-content:space-between">
<div><b style="color:#00ff88">REAL PICS: <span id="pcount">0</span>/100</b></div>
<div><div id="timer" style="background:#ff2d95;padding:6px 14px;border-radius:20px;font-weight:900;font-size:11px">45s</div></div>
</div>

<div style="margin-top:10px;text-align:center">
<button onclick="openTab('names',this)" class="btn tab active">500 NAMES</button>
<button onclick="openTab('boys',this)" class="btn tab">50 BOYS PIC</button>
<button onclick="openTab('girls',this)" class="btn tab">50 GIRLS PIC</button>
<button onclick="openTab('banner',this)" class="btn tab">100 BANNER</button>
<button onclick="openTab('logo',this)" class="btn tab">100 LOGO</button>
</div>

<div id="tab-names" class="card">
<h4>500 FANCY NAME STYLES - Click to Copy</h4>
<input id="name500" class="inp" style="margin-top:8px" placeholder="Naam - Soumya" oninput="make500()">
<div id="names500List" style="margin-top:10px;max-height:400px;overflow:auto"></div>
</div>

<div id="tab-boys" class="card" style="display:none">
<h4>50 ANIME BOYS PICS</h4>
<div style="display:flex;gap:6px;margin-top:8px"><button onclick="loadBoysPics(true)" class="btn" style="background:#fff;color:#000;flex:1">🔄 RELOAD NEW 50</button><button onclick="saveAllBoys()" class="btn" style="background:#00ff88;color:#000;flex:1">💾 SAVE ALL</button></div>
<div id="boysPicsGrid" class="grid2" style="margin-top:10px"></div>
</div>

<div id="tab-girls" class="card" style="display:none">
<h4>50 ANIME GIRLS PICS</h4>
<div style="display:flex;gap:6px;margin-top:8px"><button onclick="loadGirlsPics(true)" class="btn" style="background:#fff;color:#000;flex:1">🔄 RELOAD NEW 50</button><button onclick="saveAllGirls()" class="btn" style="background:#ff2d95;color:#fff;flex:1">💾 SAVE ALL</button></div>
<div id="girlsPicsGrid" class="grid2" style="margin-top:10px"></div>
</div>

<div id="tab-banner" class="card" style="display:none">
<h4>100 BANNER DESIGNS - Generate Banner</h4>
<input id="bannerText" class="inp" style="margin-top:8px" placeholder="Banner Text" oninput="previewBanner()">
<div id="bannerDesigns" class="grid2" style="margin-top:10px"></div>
<div id="bannerMainPrev" class="bannerPrev" style="margin-top:12px;background:linear-gradient(90deg,#00e5ff,#ff2d95)">ANIMEVERSE</div>
<button onclick="dlBannerFinal()" class="btn" style="width:100%;background:#00e5ff;color:#000;padding:12px;margin-top:8px">⬇️ GENERATE & DOWNLOAD BANNER</button>
</div>

<div id="tab-logo" class="card" style="display:none">
<h4>100 LOGO DESIGNS</h4>
<input id="logoText" class="inp" style="margin-top:8px" placeholder="Logo Text" oninput="previewLogo()">
<div id="logoDesigns" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px"></div>
<div style="margin-top:12px;background:#000;border-radius:14px;height:150px;display:flex;align-items:center;justify-content:center">
<div id="logoMainPrev" class="logoPrev" style="background:linear-gradient(135deg,#a855f7,#ff2d95)">S</div>
</div>
<button onclick="dlLogoFinal()" class="btn" style="width:100%;background:#ff2d95;color:#fff;padding:12px;margin-top:8px">⬇️ DOWNLOAD LOGO</button>
</div>

<script>
function generate500Styles(name){
let base=name||'Soumya';
let fonts=[t=>t,t=>t.toUpperCase(),t=>`𝓢${t.slice(1)}`,t=>`𝕊${t.slice(1)}`,t=>`🅂${t.slice(1).toUpperCase()}`,t=>`ꜱ${t.slice(1)}`,t=>`𝙎${t.slice(1)}`,t=>`Ⓢ${t.slice(1)}`,t=>`꧁${t}꧂`,t=>`『${t}』`,t=>`★彡${t}彡★`,t=>`༺${t}༻`,t=>`◥${t}◤`,t=>`${t}ツ`,t=>`${t}♡`,t=>`♔${t}♔`];
let symbols=['★','☆','♛','ツ','♡','◇','彡','气'];
let out=[]; for(let i=0;i<500;i++){ let f=fonts[i%fonts.length]; let txt=f(base); let sym=symbols[i%symbols.length]; if(i<20) out.push(txt); else if(i<150) out.push(sym+' '+txt+' '+sym); else out.push(`꧁༒☬${txt}☬༒꧂ ${i}`); }
return [...new Set(out)].slice(0,500);
}
function openTab(n,btn){
['names','boys','girls','banner','logo'].forEach(k=>document.getElementById('tab-'+k).style.display='none');
document.getElementById('tab-'+n).style.display='block';
document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); if(btn)btn.classList.add('active');
if(n=='boys')loadBoysPics(false); if(n=='girls')loadGirlsPics(false); if(n=='banner')previewBanner(); if(n=='logo')previewLogo();
}
function make500(){
let name=document.getElementById('name500').value||'Soumya';
let list=generate500Styles(name);
document.getElementById('names500List').innerHTML=list.map(t=>`<span class='fancy' onclick="navigator.clipboard.writeText('${t}');this.style.background='#00ff88';this.style.color='#000'">${t}</span>`).join('');
}
make500();

let boysPics=[]; function loadBoysPics(reload){ if(reload||boysPics.length==0){ boysPics=[]; for(let i=0;i<50;i++) boysPics.push(`https://picsum.photos/seed/boy${Date.now()+i}/300/200`); } document.getElementById('boysPicsGrid').innerHTML=boysPics.map(u=>`<div><img class='pic' src='${u}'><div style='display:flex;gap:4px;margin-top:4px'><button onclick="window.open('${u}')" class='btn' style='flex:1;background:#222;color:#fff'>VIEW</button><button onclick="savePic('${u}')" class='btn' style='flex:1;background:#00ff88;color:#000'>SAVE</button></div></div>`).join(''); }
function saveAllBoys(){ boysPics.forEach(u=>savePic(u)); alert('50 Boys pics saved!'); }
function loadGirlsPics(reload){ if(reload||!window.girlsPicsData){ window.girlsPicsData=[]; for(let i=0;i<50;i++) window.girlsPicsData.push(`https://picsum.photos/seed/girl${Date.now()+i}/300/200`); } let girlsPics=window.girlsPicsData; if(reload){ window.girlsPicsData=[]; for(let i=0;i<50;i++) window.girlsPicsData.push(`https://picsum.photos/seed/girl${Date.now()+i}/300/200`); girlsPics=window.girlsPicsData; } document.getElementById('girlsPicsGrid').innerHTML=girlsPics.map(u=>`<div><img class='pic' src='${u}'><div style='display:flex;gap:4px;margin-top:4px'><button onclick="window.open('${u}')" class='btn' style='flex:1;background:#222;color:#fff'>VIEW</button><button onclick="savePic('${u}')" class='btn' style='flex:1;background:#ff2d95;color:#fff'>SAVE</button></div></div>`).join(''); }
function saveAllGirls(){ window.girlsPicsData.forEach(u=>savePic(u)); alert('50 Girls pics saved!'); }

let bannerStyles=[]; for(let i=0;i<100;i++){ let h1=Math.floor(Math.random()*360), h2=(h1+60)%360; bannerStyles.push(`linear-gradient(90deg,hsl(${h1},100%,60%),hsl(${h2},100%,50%))`); }
let selectedBanner=0;
function previewBanner(){ let txt=document.getElementById('bannerText').value||'ANIMEVERSE'; document.getElementById('bannerDesigns').innerHTML=bannerStyles.map((g,i)=>`<div onclick="selectBanner(${i})" style="background:${g};height:55px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;cursor:pointer;border:${selectedBanner==i?'3px solid #fff':'1px solid #333'}">${txt.substring(0,7)}</div>`).join(''); document.getElementById('bannerMainPrev').innerText=txt; document.getElementById('bannerMainPrev').style.background=bannerStyles[selectedBanner]; }
function selectBanner(i){ selectedBanner=i; previewBanner(); }
function dlBannerFinal(){ let c=document.createElement('canvas');c.width=1200;c.height=400;let x=c.getContext('2d'); x.fillStyle='#000'; x.fillRect(0,0,1200,400); x.fillStyle='#ff2d95'; x.fillRect(0,0,1200,400); x.fillStyle='#fff';x.font='900 60px Arial';x.textAlign='center'; x.fillText(document.getElementById('bannerMainPrev').innerText,600,220); let a=document.createElement('a');a.download='banner.png';a.href=c.toDataURL();a.click(); }

let logoStyles=[]; for(let i=0;i<100;i++){ let c1=`hsl(${Math.floor(Math.random()*360)},100%,60%)`, c2=`hsl(${Math.floor(Math.random()*360)},100%,50%)`; logoStyles.push([c1,c2]); }
let selectedLogo=0;
function previewLogo(){ let txt=document.getElementById('logoText').value||'S'; document.getElementById('logoDesigns').innerHTML=logoStyles.map((s,i)=>`<div onclick="selectLogo(${i})" style="background:linear-gradient(135deg,${s[0]},${s[1]});height:65px;border-radius:${i%2==0?'50%':'12px'};display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer;border:${selectedLogo==i?'3px solid #fff':'1px solid #333'}">${txt.charAt(0)}</div>`).join(''); document.getElementById('logoMainPrev').innerText=txt.charAt(0).toUpperCase(); let sel=logoStyles[selectedLogo]; document.getElementById('logoMainPrev').style.background=`linear-gradient(135deg,${sel[0]},${sel[1]})`; }
function selectLogo(i){ selectedLogo=i; previewLogo(); }
function dlLogoFinal(){ let c=document.createElement('canvas');c.width=500;c.height=500;let x=c.getContext('2d'); let s=logoStyles[selectedLogo]; let g=x.createRadialGradient(250,250,0,250,250,250); g.addColorStop(0,s[0]); g.addColorStop(1,s[1]); x.fillStyle=g; x.beginPath(); x.arc(250,250,220,0,6.28); x.fill(); x.fillStyle='#fff';x.font='bold 120px Arial';x.textAlign='center';x.textBaseline='middle'; x.fillText(document.getElementById('logoMainPrev').innerText,250,270); let a=document.createElement('a');a.download='logo.png';a.href=c.toDataURL();a.click(); }

let savedPics=JSON.parse(localStorage.getItem('anime_pics')||'[]'); document.getElementById('pcount').innerText=savedPics.length;
function savePic(u){ if(savedPics.length>=100)return; savedPics.unshift(u); localStorage.setItem('anime_pics',JSON.stringify(savedPics)); document.getElementById('pcount').innerText=savedPics.length; }
let sec=45; setInterval(()=>{sec--; if(sec<=0){sec=45; let u=`https://picsum.photos/seed/${Date.now()}/300/200`; savePic(u);} document.getElementById('timer').innerText=sec+'s';},1000);
</script>
</body>
</html>
